<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Liste des Utilisateurs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        .table th {
            background-color: #f8f9fa;
        }
        .btn-primary, .btn-danger {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary i, .btn-danger i {
            margin-right: 5px;
        }
        .no-record {
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex">
<!-- Sidebar -->
<aside class="w-64 bg-blue-600 text-white h-full flex flex-col shadow-lg">
    <div class="p-4 text-center border-b border-blue-500">
        <h1 class="text-2xl font-bold">Gestion App</h1>
    </div>
    <nav class="flex-1 p-4 space-y-4">
        <a href="/listuser" class="block p-2 rounded hover:bg-blue-500">
            Gestion des Utilisateurs
        </a>
        <a href="/projects" class="block p-2 rounded hover:bg-blue-500">
            Gestion des Projets
        </a>
        <a href="/tasks" class="block p-2 rounded hover:bg-blue-500">
            Gestion des Tâches
        </a>
    </nav>
</aside>

<!-- Contenu principal -->
<div class="flex-1 bg-white p-6">
    <!-- Page Header -->
    <div class="text-center mb-6">
        <h1 class="text-3xl font-semibold">Liste des Utilisateurs</h1>
        <p class="text-muted">Gérez les utilisateurs enregistrés dans le système.</p>
    </div>

    <!-- Card Container -->
    <div class="card shadow-sm">
        <div class="card-body">
            <!-- Bouton Ajouter -->
            <div class="d-flex justify-content-end mb-4">
                <a href="/addUser" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Ajouter un utilisateur
                </a>
            </div>

            <!-- Tableau des utilisateurs -->
            <div th:switch="${listUsers}">
                <!-- Cas: Aucun utilisateur -->
                <div th:case="null" class="no-record">
                    <h4>Aucun utilisateur trouvé !</h4>
                </div>

                <!-- Cas: Utilisateurs présents -->
                <div th:case="*">
                    <table class="table table-hover table-bordered">
                        <thead class="thead-light">
                        <tr>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Ville</th>
                            <th>Rôles</th>
                            <th class="text-center">Modifier</th>
                            <th class="text-center">Supprimer</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${listUsers}">
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.userEmail}"></td>
                            <td th:text="${user.userCity}"></td>
                            <td>
                                <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge badge-secondary mr-1"></span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/edit/{id}(id=${user.userId})}" class="btn btn-sm btn-primary">
                                    <i class="fas fa-edit"></i> Modifier
                                </a>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/deleteUser/{id}(id=${user.userId})}" class="btn btn-sm btn-danger">
                                    <i class="fas fa-trash-alt"></i> Supprimer
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
