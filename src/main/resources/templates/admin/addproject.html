<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Ajouter un Projet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex">
<!-- Sidebar -->
<aside class="w-64 bg-blue-600 text-white h-screen flex flex-col">
    <div class="p-4 text-center border-b border-blue-500">
        <h1 class="text-2xl font-bold">Gestion App</h1>
    </div>
    <nav class="flex-1 p-4 space-y-4">
        <a href="/listuser" class="block p-2 rounded hover:bg-blue-500 transition">
            Gestion des Utilisateurs
        </a>
        <a href="/projectList" class="block p-2 rounded hover:bg-blue-500 transition">
            Gestion des Projets
        </a>
        <a href="/tasklist" class="block p-2 rounded hover:bg-blue-500 transition">
            Gestion des Tâches
        </a>
    </nav>
</aside>

<!-- Main Content -->
<main class="flex-1 p-6">
    <div class="bg-white shadow-md rounded-lg p-8 max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Ajouter un Nouveau Projet</h1>
        <form th:action="@{/projectVue}" th:object="${project}" method="POST" class="space-y-6">
            <!-- Title -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">Titre <span class="text-red-500">*</span></label>
                <input type="text" id="title" th:field="*{title}" required
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm"></textarea>
            </div>

            <!-- Scrum Master -->
            <div>
                <label for="scrum-master" class="block text-sm font-medium text-gray-700">Scrum Master</label>
                <select id="scrum-master" th:field="*{scrumMaster}"
                        class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="" disabled selected>Choisissez un Scrum Master</option>
                    <option th:each="master : ${scrumMasters}" th:value="${master.getUserId()}"
                            th:text="${master.getName()}"></option>
                </select>
            </div>

            <!-- Start Date -->
            <div>
                <label for="start-date" class="block text-sm font-medium text-gray-700">Date de début <span class="text-red-500">*</span></label>
                <input type="date" id="start-date" th:field="*{startDate}" required
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
            </div>

            <!-- End Date -->
            <div>
                <label for="end-date" class="block text-sm font-medium text-gray-700">Date de fin</label>
                <input type="date" id="end-date" th:field="*{endDate}"
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
            </div>

            <!-- Status -->
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700">Statut</label>
                <select id="status" th:field="*{status}"
                        class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm">
                    <option value="CREATED">Créé</option>
                    <option value="STARTED" selected>En cours</option>
                    <option value="UPDATED">Mis à jour</option>
                    <option value="DELETED">Supprimé</option>
                </select>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition">
                    Soumettre
                </button>
            </div>
        </form>
    </div>
</main>
</body>

</html>
