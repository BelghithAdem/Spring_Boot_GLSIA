<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Mettre à jour la tâche</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        .table th {
            background-color: #f8f9fa;
        }
        .btn-primary, .btn-danger {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary i, .btn-danger i {
            margin-right: 5px;
        }
        .no-record {
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex">
<!-- Sidebar -->
<aside class="w-64 bg-blue-600 text-white h-auto flex flex-col shadow-lg">
    <div class="p-4 text-center border-b border-blue-500">
        <h1 class="text-2xl font-bold">Gestion App</h1>
    </div>
    <nav class="flex-1 p-4 space-y-4">
        <a href="/listuser" class="block p-2 rounded hover:bg-blue-500">Gestion des Utilisateurs</a>
        <a href="/projectList" class="block p-2 rounded hover:bg-blue-500">Gestion des Projets</a>
        <a href="/tasklist" class="block p-2 rounded hover:bg-blue-500">Gestion des Tâches</a>
    </nav>
</aside>

<!-- Main Content -->
<main class="flex-1 bg-white p-6">
    <div class="bg-white shadow-md rounded-lg p-6 max-w-lg mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Mettre à jour la tâche</h1>
        <form th:action="@{/taskVue/update/{id}(id=${task.id})}" th:object="${task}" method="POST" class="space-y-6">
            <!-- Title -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700">Titre <span class="text-red-500">*</span></label>
                <input type="text" id="title" th:field="*{title}" required
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <!-- Assign To -->
            <div>
                <label for="scrum-master" class="block text-sm font-medium text-gray-700">Assigneé à</label>
                <select id="scrum-master" th:field="*{assignedUser}"
                        class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="" disabled>Choisissez un Membre</option>
                    <option th:each="master : ${members}"
                            th:value="${master.getUserId()}"
                            th:text="${master.getName()}"></option>
                </select>
            </div>

            <!-- Due Date -->
            <div>
                <label for="due-date" class="block text-sm font-medium text-gray-700">Date d'échéance <span class="text-red-500">*</span></label>
                <input type="date" id="due-date" th:field="*{startDate}" required
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- End Date -->
            <div>
                <label for="end-date" class="block text-sm font-medium text-gray-700">Date de Fin <span class="text-red-500">*</span></label>
                <input type="date" id="end-date" th:field="*{endDate}" required
                       class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Status -->
            <div>
                <label for="status" class="block text-sm font-medium text-gray-700">Statut</label>
                <select id="status" th:field="*{status}"
                        class="mt-2 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="PENDING" th:selected="${task.status == 'PENDING'}">En attente</option>
                    <option value="COMPLETED" th:selected="${task.status == 'COMPLETED'}">Terminé</option>
                    <option value="BLOQUED" th:selected="${task.status == 'BLOQUED'}">Bloqué</option>
                    <option value="FINISHED" th:selected="${task.status == 'FINISHED'}">Finalisé</option>
                </select>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Mettre à jour la tâche
                </button>
            </div>
        </form>
    </div>
</main>
</body>

</html>
