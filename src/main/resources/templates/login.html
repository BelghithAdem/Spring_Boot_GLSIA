<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white shadow-md rounded-lg p-8 space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-700">Formulaire de Connexion</h2>

    <!-- Formulaire de connexion -->
    <form th:action="@{/signinVue}" method="post" class="space-y-4">
        <div>
            <label for="userEmail" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="Email" class="w-full px-3 py-2 border rounded-md" required />
        </div>
        <div>
            <label for="userPassword" class="block text-sm font-medium text-gray-700">Mot de Passe</label>
            <input type="password" id="userPassword" name="userPassword" placeholder="Mot de Passe" class="w-full px-3 py-2 border rounded-md" required />
        </div>

        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">Se Connecter</button>

        <p class="text-center text-sm text-gray-500 mt-4">
            Vous n'avez pas de compte ? <a href="/register" class="text-blue-500 hover:underline">S'inscrire</a>
        </p>
        <div th:if="${userEmail}">
            <p>Bienvenue, <span th:text="${userEmail}"></span></p>
            <p>Rôles: <span th:text="${roles}"></span></p>
            <p>JWT: <span th:text="${jwt}"></span></p>
        </div>
    </form>
    <form action="/logoutVue" method="post">
        <button type="submit">Logout</button>
    </form>


</div>

</body>
</html>
