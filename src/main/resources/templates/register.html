<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white shadow-md rounded-lg p-8 space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-700">Formulaire d'Inscription</h2>

    <!-- Formulaire d'inscription -->
    <form th:action="@{/auth/signupVue}" method="post" class="space-y-4">
        <div>
            <label for="userEmail" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="userEmail" name="userEmail" placeholder="Email" class="w-full px-3 py-2 border rounded-md" required />
        </div>
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Nom Complet</label>
            <input type="text" id="name" name="name" placeholder="Nom Complet" class="w-full px-3 py-2 border rounded-md" required />
        </div>
        <div>
            <label for="userPassword" class="block text-sm font-medium text-gray-700">Mot de Passe</label>
            <input type="password" id="userPassword" name="userPassword" placeholder="Mot de Passe" class="w-full px-3 py-2 border rounded-md" required />
        </div>
        <div>
            <label for="userCity" class="block text-sm font-medium text-gray-700">Ville</label>
            <input type="text" id="userCity" name="userCity" placeholder="Ville" class="w-full px-3 py-2 border rounded-md" required />
        </div>
        <div>
            <label for="userRole" class="block text-sm font-medium text-gray-700">Rôle</label>
            <select id="userRole" name="userRole" class="w-full px-3 py-2 border rounded-md" required>
                <option value="Membre_ROLE">Membre</option>
                <option value="ChefScrum_ROLE">Chef Scrum</option>
                <option value="ADMIN_ROLE">Admin</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600">S'inscrire</button>
    </form>



</div>

</body>
</html>
